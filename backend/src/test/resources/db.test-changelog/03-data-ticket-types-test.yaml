databaseChangeLog:
  - changeSet:
      id: 03-data-ticket-types
      author: dev
      changes:
        - insert:
            tableName: ticket_type
            columns:
              - column: { name: name, value: "TicketType01" }
              - column: { name: category, value: "TIME" }
