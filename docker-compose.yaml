services:
  postgres:
    image: postgres:13
    container_name: bilet-miejski-db
    environment:
      POSTGRES_USER: biletuser
      POSTGRES_PASSWORD: biletpass
      POSTGRES_DB: biletmiejski
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  postgres-test:
    image: postgres:13
    container_name: bilet-miejski-test-db
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: biletmiejski_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  postgres_test_data: