<mat-card *ngIf="user">
  <mat-card-header>
    <mat-card-title>{{ user.email }}</mat-card-title>
    <mat-card-subtitle>Rola: {{ user.role }}</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <p>Witaj, {{ user.email }}! Twoja rola to {{ user.role }}.</p>

    <!-- Wyświetlanie biletów użytkownika -->
    <mat-list *ngIf="tickets && tickets.length > 0">
      <mat-list-item *ngFor="let ticket of tickets">
        <p>{{ ticket.code }} - {{ ticket.purchaseDate | date }}</p>
      </mat-list-item>
    </mat-list>

    <!-- Jeśli brak biletów -->
    <p *ngIf="tickets.length === 0">Brak biletów.</p>

    <button mat-button (click)="goToTickets()">Zobacz bilety</button>
  </mat-card-content>
</mat-card>

<!-- Jeśli użytkownik nie jest zalogowany -->
<mat-card *ngIf="!user">
  <mat-card-header>
    <mat-card-title>Brak informacji o użytkowniku</mat-card-title>
  </mat-card-header>
</mat-card>
