<div id="container">
  <form [formGroup]="form">
    <h2>{{ data ? 'Edytuj bilet' : 'Dodaj nowy bilet' }}</h2>
    <mat-form-field appearance="fill" style="width:100%;">
      <mat-label>Nazwa</mat-label>
      <input matInput formControlName="name">
    </mat-form-field>

    <mat-form-field appearance="fill" style="width:100%;">
      <mat-label>Kategoria</mat-label>
      <mat-select formControlName="category">
        <mat-option value="ONE_TIME">Jednorazowy</mat-option>
        <mat-option value="TIME">Czasowy</mat-option>
        <mat-option value="PERIOD">Okresowy</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="fill" style="width:100%;">
      <mat-label>Zniżka</mat-label>
      <mat-select formControlName="discountType">
        <mat-option value="NORMAL">Normalny</mat-option>
        <mat-option value="DISCOUNTED">Ulgowy</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="fill" style="width:100%;">
      <mat-label>Cena</mat-label>
      <input matInput type="number" formControlName="price">
    </mat-form-field>

    <mat-form-field appearance="fill" style="width:100%;">
      <mat-label>Czas trwania (min)</mat-label>
      <input matInput type="number" formControlName="durationMinutes">
    </mat-form-field>
  </form>

  <div class="button-row">
    <button mat-stroked-button color="warn" (click)="cancel()">Anuluj</button>
    <button mat-raised-button color="primary" (click)="save()">Zapisz</button>
  </div>

</div>
