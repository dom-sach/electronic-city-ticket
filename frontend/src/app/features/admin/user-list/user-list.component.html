<div class="page-content-container">

  <div id="page-header">
    <h2 style="margin: 0">Witaj Administratorze!</h2>
    <p>{{currentUserEmail}}</p>
  </div>


  <mat-form-field appearance="fill">
    <mat-label>Wyszukaj użytkownika po e-mailu</mat-label>
    <input matInput [(ngModel)]="searchQuery" placeholder="Wpisz email">
  </mat-form-field>

  <mat-tab-group >
    <mat-tab label="Pasażerowie">
      <mat-list *ngIf="usersByRole.get('PASSENGER')">
        <mat-list-item *ngFor="let user of filterUsers('PASSENGER')">
          <span>{{ user.email }}</span>
        </mat-list-item>
      </mat-list>
    </mat-tab>

    <mat-tab label="Bileterzy">
      <mat-list *ngIf="usersByRole.get('TICKET_INSPECTOR')">
        <mat-list-item *ngFor="let user of filterUsers('TICKET_INSPECTOR')">
          <span>{{ user.email }}</span>
        </mat-list-item>
      </mat-list>
    </mat-tab>

    <mat-tab label="Administratorzy">
      <mat-list *ngIf="usersByRole.get('ADMINISTRATOR')">
        <mat-list-item *ngFor="let user of filterUsers('ADMINISTRATOR')">
          <span>{{ user.email }}</span>
        </mat-list-item>
      </mat-list>
    </mat-tab>
  </mat-tab-group>
</div>
